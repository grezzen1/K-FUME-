<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>K FUMÉ Runner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#160f08;font-family:system-ui;color:#fff;touch-action:none}.game{width:min(100vw,440px);height:100vh;max-height:900px;position:relative;overflow:hidden;background:#d5893e}.game:before{content:'';position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(45deg,#1e355b 0 5px,transparent 5px 16px)}canvas{width:100%;height:100%;display:block}.screen{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:25px;background:linear-gradient(#271709a8,#1a0e06dc)}.screen.hide{display:none}.panel{max-width:330px}.logo{width:110px;border-radius:50%;border:3px solid #f6bd4e;box-shadow:0 6px 22px #0008}.title{font-size:34px;font-weight:1000;color:#ffc34d;text-shadow:3px 3px #9d3e13;margin:8px 0}.sub{color:#ffe0a1}.play{border:0;border-radius:14px;padding:15px 23px;margin:16px 0;background:#ed7827;color:#fff;font-size:19px;font-weight:950;box-shadow:0 5px #8e3714;cursor:pointer}.small{font-size:12px;color:#f2d39a}.lang{border:1px solid #eeb653;background:#3a220d;color:#fff;border-radius:8px;padding:7px;margin:4px}.hud{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:900;text-shadow:1px 2px #35170a}.badge{background:#241506bd;border:1px solid #e1a245;border-radius:12px;padding:7px 10px}.controls{position:absolute;z-index:2;bottom:20px;left:0;right:0;display:flex;justify-content:space-around}.controls button{border:2px solid #f4c263;background:#3a210fb8;color:#fff;border-radius:50%;width:59px;height:59px;font-size:25px}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}.skin{background:#ffffff16;border:1px solid #e1a245;padding:9px;border-radius:8px;font-size:12px}.skin b{display:block;color:#ffc34d}.rank{margin:9px 0;padding:8px;border-radius:8px;background:#ffffff16;font-size:13px}
</style></head><body><div class="game"><canvas id="c"></canvas><div class="hud"><span class="badge" id="score">🌾 0</span><span class="badge" id="power">⚡</span><span class="badge" id="best">🏆 0</span></div><div class="controls"><button id="left">←</button><button id="jump">↑</button><button id="right">→</button></div>
<div class="screen" id="menu"><div class="panel"><img class="logo" src="kfume-logo.jpg"><div class="title">K FUMÉ RUNNER</div><p class="sub" id="intro">Le poulet malien traverse Bamako !</p><button class="play" onclick="start()">DÉMARRE LE POULET !</button><div class="shop"><div class="skin"><b>🐔 Poulet malien</b>Disponible</div><div class="skin"><b>🐓 Coq guerrier</b>500 grains</div><div class="skin"><b>✨ Poulet doré</b>1 200 grains</div><div class="skin"><b>🌊 Poulet de Mopti</b>800 grains</div></div><p class="small">Glisse : ← → pour les voies · ↑ pour sauter · Hors ligne · Score sauvegardé</p><button class="lang" onclick="language('fr')">Français</button><button class="lang" onclick="language('bm')">Bamanankan</button></div></div>
<div class="screen hide" id="over"><div class="panel"><img class="logo" src="kfume-logo.jpg"><div class="title" id="overTitle">Aïe ! Le poulet est tombé !</div><p id="result"></p><div id="ranking"></div><button class="play" onclick="start()">REJOUER</button><button class="lang" onclick="document.querySelector('#over').classList.add('hide');document.querySelector('#menu').classList.remove('hide')">Menu</button></div></div></div>
<script>
const cv=document.querySelector('#c'),x=cv.getContext('2d');let W,H,dpr,run=0,lane=1,y=0,vy=0,slide=0,score=0,speed=7,items=[],frames=0,best=+localStorage.kfRunnerBest||0,lang='fr',touchX=0;function fit(){dpr=devicePixelRatio;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',fit);fit();document.querySelector('#best').textContent='🏆 '+best;
function language(l){lang=l;document.querySelector('#intro').textContent=l==='bm'?'Sɔ̀gɔma, sisen bɛ Bamakɔ la !':'Le poulet malien traverse Bamako !';document.querySelector('.play').textContent=l==='bm'?'SISƐN DAMINƐ !':'DÉMARRE LE POULET !'}
function start(){fit();run=1;lane=1;y=0;vy=0;score=0;speed=7;items=[];frames=0;document.querySelector('#menu').classList.add('hide');document.querySelector('#over').classList.add('hide');requestAnimationFrame(loop)}
function move(n){if(!run)return;lane=Math.max(0,Math.min(2,lane+n))}function jump(){if(!run)return;if(y===0)vy=16;else slide=24}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);document.querySelector('#jump').onclick=jump;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')jump()});cv.addEventListener('touchstart',e=>touchX=e.touches[0].clientX);cv.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-e.touches[0]?.clientY;if(dx>25)move(1);else if(dx<-25)move(-1);else jump()});
function loop(){if(!run)return;frames++;speed=Math.min(17,7+score/130);draw();update();requestAnimationFrame(loop)}function update(){if(y>0||vy){y+=vy;vy-=1.05;if(y<0){y=0;vy=0}}if(slide)slide--;items.forEach(o=>o.z-=speed);items=items.filter(o=>{if(o.z<0){if(o.type==='ob'&&o.l===lane&&y<24&&!slide){gameover();return false}return false}if(o.z<18&&o.type==='coin'&&o.l===lane){score+=10;beep(660);return false}if(o.z<18&&o.type==='power'&&o.l===lane){score+=35;speed=Math.max(5,speed-2);return false}return true});if(frames%Math.max(22,75-Math.floor(score/45))===0)items.push({l:Math.floor(Math.random()*3),z:100,type:Math.random()<.61?'coin':Math.random()<.82?'ob':'power'});score++;document.querySelector('#score').textContent='🌾 '+score;document.querySelector('#power').textContent=score>0&&score%170<40?'🧲 Aimant':'⚡ Attaya'}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#d59a58');sky.addColorStop(.48,'#edbe75');sky.addColorStop(.49,'#b35c2c');sky.addColorStop(1,'#7b280e');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#8c4b25';x.fillRect(0,H*.42,W,H*.08);x.fillStyle='#4b3425';x.beginPath();x.moveTo(W*.32,H);x.lineTo(W*.68,H);x.lineTo(W*.57,H*.48);x.lineTo(W*.43,H*.48);x.fill();for(let i=0;i<3;i++){let lx=W*(.43+i*.07);x.fillStyle='#d9ac70';x.fillRect(lx,H*.51,2,H*.47)}x.fillStyle='#6c3217';x.fillRect(0,H*.39,90,28);x.fillRect(W-105,H*.37,105,30);x.fillStyle='#e7bd7c';x.font='26px serif';x.fillText('🌳  🏘️   🛒',10,H*.42);x.fillText('🌉 Niger · Pont des Martyrs',W*.38,H*.35);items.forEach(o=>{let p=1-o.z/110,yy=H*.48+p*H*.42,s=12+p*42,lx=W*.5+(o.l-1)*W*.19*p;x.font=s+'px serif';x.fillText(o.type==='coin'?'🌾':o.type==='power'?'🍵':Math.random()>.5?'🛺':'🕳️',lx-s/2,yy)});let px=W*.5+(lane-1)*W*.19;let py=H*.79-y;x.font=(slide?38:58)+'px serif';x.fillText('🐔',px-25,py);x.fillStyle='#fff0c5';x.font='bold 12px system-ui';x.fillText('K FUMÉ',px-22,py+15)}
function gameover(){run=0;best=Math.max(best,score);localStorage.kfRunnerBest=best;document.querySelector('#best').textContent='🏆 '+best;document.querySelector('#result').textContent='Score : '+score+' grains · Meilleur score : '+best;document.querySelector('#ranking').innerHTML='<div class="rank">🥇 Poulet de Bamako — '+best+'</div><div class="rank">🥈 Coq de Ségou — '+Math.max(0,best-35)+'</div><div class="rank">🥉 Poulet de Mopti — '+Math.max(0,best-80)+'</div>';document.querySelector('#over').classList.remove('hide');beep(180)}function beep(f){try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.07)}catch(e){}}
</script></body></html>
